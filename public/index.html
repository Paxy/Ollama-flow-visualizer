<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Flow Visualizer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;background:#0a0e14;color:#c5c8c6;height:100vh;overflow-y:auto}
    .header{padding:10px 24px;background:#151921;border-bottom:1px solid #2a2e35;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
    .header h1{font-size:1rem;color:#7ec8e3;display:flex;align-items:center;gap:10px}
    .header h1 .dot{width:10px;height:10px;border-radius:50%;background:#50fa7b;display:inline-block;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .header .ctrls{display:flex;gap:8px;align-items:center}
    .header button{padding:4px 12px;border:1px solid #2a2e35;border-radius:4px;background:#1a1e24;color:#8b949e;cursor:pointer;font-family:inherit;font-size:.75rem;transition:.15s}
    .header button:hover{background:#2a2e35;color:#c5c8c6}
    #summary{font-size:.75rem;color:#6a6e75;white-space:nowrap}
    #summaryBar{padding:8px 24px;background:#0d1117;border-bottom:1px solid #1a1e24;display:flex;gap:20px;font-size:.75rem;color:#6a6e75;flex-wrap:wrap}
    #summaryBar .seg{display:flex;align-items:center;gap:5px}
    .group{border-bottom:1px solid #1a1e24}
    .g-hdr{display:flex;align-items:center;padding:10px 24px;cursor:pointer;gap:12px;flex-wrap:wrap;transition:background .15s}
    .g-hdr:hover{background:#151921}
    .g-hdr .arrow{color:#6272a4;font-size:.7rem;transition:transform .2s;flex-shrink:0}
    .g-hdr.expanded .arrow{transform:rotate(90deg)}
    .g-hdr .prompt{color:#8b949e;font-size:.82rem;flex:1;min-width:200px;max-width:100%;line-height:1.4;word-break:break-word;white-space:pre-wrap}
    .g-hdr .ctx{border-left:2px solid #2a2e35;padding-left:10px;color:#6272a4;font-size:.72rem;flex-shrink:0;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .g-hdr .ts{color:#6a6e75;font-size:.7rem;flex-shrink:0}
    .g-hdr .status{font-size:.75rem;padding:2px 8px;border-radius:3px;flex-shrink:0;font-weight:600}
    .g-hdr .status.active{background:#292a33;color:#f1fa8c;border:1px solid #f1fa8c44}
    .g-hdr .status.complete{background:#1a2a1a;color:#50fa7b;border:1px solid #50fa7b44}
    .g-hdr .status.error{background:#2a1a1a;color:#ff5555;border:1px solid #ff555544}
    .g-hdr .count{font-size:.7rem;color:#6272a4;flex-shrink:0}
    .g-hdr .dur{font-size:.75rem;color:#bd93f9;flex-shrink:0;font-weight:600}
    .g-hdr .tools-badge{font-size:.65rem;color:#ffa657;background:#2a1e10;padding:1px 6px;border-radius:3px;border:1px solid #ffa65733;flex-shrink:0}
    .g-hdr .expand-link{color:#5a9eff;cursor:pointer;font-size:.65rem;text-decoration:underline;flex-shrink:0;white-space:nowrap;margin-left:-8px}
    .g-hdr .expand-link:hover{color:#7ab8ff}
    .g-det{display:none;padding:0 24px 16px;background:#0d1117;border-top:1px solid #1a1e24}
    .g-det.open{display:block}
    .g-header-info{display:flex;gap:16px;flex-wrap:wrap;padding:12px 0 8px;font-size:.72rem;color:#6a6e75;border-bottom:1px solid #1a1e24;margin-bottom:10px}
    .g-header-info span{display:flex;align-items:center;gap:4px}
    .decoded-prompt{background:#060a10;border:1px solid #1a1e24;border-radius:6px;padding:12px;font-size:.78rem;color:#c5c8c6;line-height:1.55;max-height:300px;overflow-y:auto;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
    .decoded-prompt::-webkit-scrollbar{width:4px}
    .decoded-prompt::-webkit-scrollbar-thumb{background:#2a2e35;border-radius:2px}
    .tool-section{border:1px solid #1a1e24;border-radius:6px;margin-bottom:10px;background:#0d1117}
    .tool-section-hdr{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.75rem;color:#ffa657;font-weight:600;border-bottom:1px solid #1a1e24}
    .tool-section-hdr:hover{background:#151921}
    .tool-section-hdr .arrow{transition:transform .2s;color:#6272a4}
    .tool-section-hdr.open .arrow{transform:rotate(90deg)}
    .tool-section-body{display:none;padding:8px 12px}
    .tool-section-body.open{display:block}
    .tool-card{margin:4px 0;padding:8px 10px;background:#060a10;border-radius:4px;border:1px solid #2a2e35}
    .tool-card .tc-name{color:#ffa657;font-size:.75rem;font-weight:600;margin-bottom:2px}
    .tool-card .tc-args{font-size:.65rem;color:#8b949e;margin-top:2px;max-height:200px;overflow-y:auto}
    .req-row{border-bottom:1px solid #1a1e24;padding:6px 0}
    .req-row:last-child{border-bottom:none}
    .req-hdr{display:flex;align-items:center;gap:10px;font-size:.73rem;color:#8b949e;cursor:pointer;padding:4px 0}
    .req-hdr:hover{color:#c5c8c6}
    .req-hdr .r-num{color:#4a4e55;flex-shrink:0}
    .req-hdr .r-ts{color:#6a6e75;flex-shrink:0}
    .req-hdr .r-st{flex-shrink:0}
    .req-hdr .r-st.ok{color:#50fa7b}
    .req-hdr .r-st.err{color:#ff5555}
    .req-hdr .r-st.stream{color:#f1fa8c}
    .req-hdr .r-st.pend{color:#ff5555}
    .req-hdr .r-preview{color:#6272a4;font-size:.7rem;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .req-hdr .r-dur{color:#bd93f9;flex-shrink:0}
    .req-hdr .r-dur.right{margin-left:auto;padding-left:8px}
    .req-hdr .r-stop{flex-shrink:0;margin-left:auto;cursor:pointer;padding:2px 6px;font-size:.9rem;color:#ff3333;background:transparent;border:1px solid transparent;font-family:inherit;display:none;line-height:1;border-radius:4px;transition:.15s}
    .req-hdr .r-stop.show{display:inline-block}
    .req-hdr .r-stop:hover{color:#ff5555;background:#2a0a0a;border-color:#ff333366}
    .req-body{display:none;margin-top:8px;background:#060a10;border:1px solid #1a1e24;border-radius:6px;padding:12px;overflow-x:auto;font-size:.72rem;line-height:1.5;max-height:60vh;overflow-y:auto}
    .req-body.visible{display:block}
    .lbl{color:#bd93f9;font-weight:600;margin-bottom:4px;display:inline-block}
    .detail-section{margin-bottom:10px;padding:8px;background:#0d1117;border-radius:4px;border:1px solid #21262d}
    .detail-section pre{margin:4px 0 0;font-size:.68rem;max-height:300px;overflow-y:auto}
    .req-body-raw{white-space:pre-wrap !important;word-break:break-word !important;line-height:1.5 !important;font-size:.72rem !important;max-height:none !important;color:#c5c8c6;display:none}
    .req-body-raw.show{display:block}
    .req-summary{font-size:.8rem;padding:10px;margin-bottom:8px;border:1px solid #3a3f4a;border-radius:6px;background:#1a1f26;color:#c5c8c6}
    .req-summary .summary-row{display:flex;gap:8px;margin:4px 0}
    .req-summary .summary-label{color:#5a9eff;font-weight:600}
    .req-summary .summary-content{color:#b5b9c0}
    .req-summary .truncate{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .req-summary .expand-btn{color:#5a9eff;cursor:pointer;font-size:.7rem;text-decoration:underline}
    .req-summary .expand-btn:hover{color:#7ab8ff}
    .req-summary pre{display:none;white-space:pre-wrap;word-break:break-word;font-size:.7rem;color:#b5b9c0;margin-top:8px}
    .req-summary pre.expanded{display:block}
    .req-collapsed{display:none}
    .req-collapsed.show{display:block}
    .req-toggle{cursor:pointer;user-select:none}
    .req-toggle:hover{color:#7ec8e3}
    .j-key{color:#8be9fd}.j-str{color:#98c379}.j-num{color:#d4be98}.j-bool{color:#ff6ac1}.j-null{color:#6272a4}
    .empty{text-align:center;color:#4a4e55;margin-top:120px;font-size:1rem}
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="dot"></span> Ollama Flow Visualizer</h1>
    <div class="ctrls">
      <span id="summary"></span>
      <button id="clrBtn">🗑 Clear</button>
    </div>
  </div>
  <div id="summaryBar"></div>
  <div id="groups"></div>

<script>
let logs=[];
let groupsTicker = null; // jedan interval za sve grupe (ticka svake 2s)

// Globalna mapa tool call-ova po ID-u (popunjava se iz requestToolCalls i toolCallsExec svih itema)
// Koristi se za ID-based match sa toolOutputs.toolCallId
let allToolCallsById = {};
let latestOutputReqById = {};  // toolCallId → id najnovijeg req-a sa tim outputom

// Osvrži allToolCallsById i latestOutputReqById iz svih logova
function rebuildToolCallMap() {
  const m = {};
  logs.forEach(log => {
    // Iz requestToolCalls (imaju prave ID-eve iz request body-ja)
    (log.requestToolCalls || []).forEach(tc => {
      if (tc.id && !m[tc.id]) {
        // Konvertuj rawArgs -> arguments za konzistentan prikaz
        const copy = JSON.parse(JSON.stringify(tc));
        if (copy.function && copy.function.rawArgs && !copy.function.arguments) {
          try { copy.function.arguments = JSON.parse(copy.function.rawArgs); } catch(e) { copy.function.arguments = copy.function.rawArgs; }
        }
        delete copy.function.rawArgs;
        m[tc.id] = copy;
      }
    });
    // Iz toolCallsExec (mogu imati ID ako server uspe da ga poveže)
    (log.toolCallsExec || []).forEach(tc => {
      if (tc.id && !m[tc.id]) m[tc.id] = tc;
    });
  });
  allToolCallsById = m;
  // Pronađi najnoviji req za svaki toolCallId u toolOutputs
  const lo = {};
  logs.forEach(log => {
    (log.toolOutputs || []).forEach(to => {
      if (to.toolCallId) lo[to.toolCallId] = log.id;
    });
  });
  latestOutputReqById = lo;
}

// Sačuvaj proširena stanja: expandedGroups = {key: true}
let expandedGroups = {};
function saveExpandedState() {
  const els = document.querySelectorAll('.group');
  if (!els.length) return;
  els.forEach(el => {
    const key = el.dataset.groupKey;
    if (key) {
      const isExpanded = el.querySelector('.g-hdr.expanded') !== null;
      if (isExpanded) expandedGroups[key] = true;
      else delete expandedGroups[key];
    }
  });
}
function restoreExpandedState() {
  const els = document.querySelectorAll('.group');
  if (!els.length) return;
  els.forEach(el => {
    const key = el.dataset.groupKey;
    if (key && expandedGroups[key]) {
      const hdr = el.querySelector('.g-hdr');
      const det = el.querySelector('.g-det');
      if (hdr && det) {
        hdr.classList.add('expanded');
        det.classList.add('open');
      }
    }
  });
}

function normalizePrompt(p){if(!p)return null;return p.trim().replace(/\s+/g,' ')}
function fmtTs(iso){if(!iso)return '--';const d=new Date(iso);return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function fmtTsFull(iso){if(!iso)return '--';const d=new Date(iso);return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function fmtDur(ms){if(!ms||ms<0)return '0m 0s';const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;if(h>0)return `${h}h ${m}m ${sec}s`;return `${m}m ${sec}s`}
function fmtSz(b){if(!b||b<0)return '0B';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(2)+'MB'}
// Newline fixer
function fixNewlines(s){if(!s)return '';return s.split('\\n').join('\n');}
function escHtml(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function prettyJSON(v){try{return JSON.stringify(typeof v==='string'?JSON.parse(v):v,null,2)}catch(e){return typeof v==='string'?v:JSON.stringify(v)}}
function highlightJSON(s){if(!s)return '';let a=escHtml(s);a=a.replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"]*)*")\s*:/g,m=>`<span class="j-key">${m}</span>`);a=a.replace(/:\s*"([^"]*)"/g,(m,v)=>`: <span class="j-str">"${v}"</span>`);a=a.replace(/:\s*(true|false)/g,(m,v)=>`: <span class="j-bool">${v}</span>`);a=a.replace(/:\s*(-?\d[\d.]*)/g,(m,v)=>`: <span class="j-num">${v}</span>`);a=a.replace(/:\s*null/g,m=>`: <span class="j-null">null</span>`);return a;}

// ===== Pametno grupisanje =====
// Grupišemo po kombinaciji: (userPrompt, broj tool_calls u requestu)
// Svaki "zaokruženi" tok je jedno grupisanje

function makeGroupKey(log) {
  // Group exclusively by user prompt - same prompt = same group
  const prompt = normalizePrompt(log.userPrompt) || 'NO_PROMPT';
  return prompt;
}

// Helper: accordion - collapse others on expand
function toggleGroup(el) {
  document.querySelectorAll('.group .g-hdr.expanded').forEach(h => {
    if (h !== el) { h.classList.remove('expanded'); h.nextElementSibling.classList.remove('open'); }
  });
  el.classList.toggle('expanded');
  el.nextElementSibling.classList.toggle('open');
  // Kad se grupa otvori, skroluj decoded response na dno
  if (el.classList.contains('expanded')) {
    const dp = el.nextElementSibling.querySelector('.decoded-prompt');
    if (dp) requestAnimationFrame(() => { dp.scrollTop = dp.scrollHeight; });
  }
}
function stopRequest(id) {
  const btn = document.querySelector(`.r-stop[data-id="${CSS.escape(id)}"]`);
  if (btn) { btn.textContent = '⋯'; btn.style.color = '#6272a4'; btn.style.cursor = 'default'; btn.onclick = null; }
  fetch('/api/stop/' + encodeURIComponent(id), { method: 'POST' })
    .then(r => r.json())
    .then(d => { if (d.ok) console.log('Stopped:', id); })
    .catch(() => {});
}

function stopBtnHtml(id, status) {
  if (status === 'pending' || status === 'streaming') {
    return '<span class="r-stop show" data-id="' + escHtml(id) + '" onclick="event.stopPropagation();stopRequest(\'' + escHtml(id) + '\')" title="Stop request">&#x1F6D1;</span>';
  }
  return '<span class="r-stop"></span>';
}

function expandGroupPrompt(el) {
  const full = el.dataset.full;
  const promptSpan = el.parentElement.querySelector('.prompt');
  if (promptSpan) promptSpan.textContent = full;
  el.style.display = 'none';
}

function toggleReq(el) {
  const p = el.closest('.g-det');
  if (p) {
    p.querySelectorAll('.req-hdr').forEach(h => {
      if (h !== el) h.nextElementSibling.classList.remove('visible');
    });
  }
  el.nextElementSibling.classList.toggle('visible');
}

// Helper: uzima tool callove iz odgovarajućeg izvora
// Prioritizuje toolCallsExec (iz Ollama response streama) nad requestToolCalls (iz request body-ja)
// jer toolCallsExec sadrži ORIGINALNE tool callove iz prvog odgovora
// Legacy - unused stubs for backward compat
getDisplayToolCalls = function(item) { return []; };
generateToolHtml = function(rtc, tos) { return ''; };

// Generates HTML for tool calls WITH outputs, matched by ID from the global allToolCallsById map.
// Used in the request where tool outputs arrived. itemId je ID req-a kako bi proverili da li je najnoviji.
function generateToolOutputHtml(tos, itemId) {
  if (!tos || !tos.length) return '';
  let html = '';
  tos.forEach(to => {
    if (!to.toolCallId) return;
    // Prikazi output samo u najnovijem req-u koji ima ovaj toolCallId
    if (itemId && latestOutputReqById[to.toolCallId] && latestOutputReqById[to.toolCallId] !== itemId) return;
    const tc = allToolCallsById[to.toolCallId] || null;
    if (!tc) return; // no matching tool call
    const nm = tc.function?.name || 'unknown';
    // Format args
    let args = '';
    const fnArgs = tc.function?.arguments || tc.function?.rawArgs;
    if (fnArgs) {
      let a = fnArgs;
      if (typeof a === 'object') { args = JSON.stringify(a, null, 2); }
      else if (typeof a === 'string') { try { args = JSON.stringify(JSON.parse(a), null, 2); } catch(e) { args = a; } }
    }
    // Format output
    let outVal = '';
    let v = to.content || to.output || to.result || to.response || to.value || JSON.stringify(to);
    if (typeof v === 'object') v = JSON.stringify(v, null, 2);
    else if (typeof v === 'string') v = v.replace(/\\n/g, '\n');
    outVal = v;
    html += '<div class="req-tool-pair" style="margin:6px 0;padding:8px 10px;background:#0d1117;border:1px solid #2a2e35;border-radius:6px">';
    html += '<div class="tp-name" style="color:#ffa657;font-size:.82rem;font-weight:600;margin-bottom:4px">\u26a1 ' + escHtml(nm) + '</div>';
    html += '<div class="tp-args" style="margin-bottom:4px"><div style="color:#8b949e;font-size:.72rem;font-weight:500">\uD83D\uDCCB Args:</div><pre style="margin:4px 0 0;font-size:.7rem;overflow:auto;color:#c5c8c6;white-space:pre-wrap;word-break:break-word">' + escHtml(args || '{}') + '</pre></div>';
    html += '<div class="tp-out" style="border-top:1px solid #2a2e35;padding-top:4px"><div style="color:#50fa7b;font-size:.72rem;font-weight:500">\uD83D\uDCE4 Output:</div><pre style="margin:4px 0 0;font-size:.72rem;max-height:250px;overflow-y:auto;white-space:pre-wrap;word-break:break-word">' + escHtml(outVal) + '</pre></div>';
    html += '</div>';
  });
  return html;
}

// Generates HTML for tool calls WITHOUT outputs (the LLM requested tools, waiting for exec).
// Used in the request where toolCallsExec was received.
function generateToolCallHtml(calls) {
  if (!calls || !calls.length) return '';
  let html = '';
  calls.forEach(tc => {
    const nm = tc.function?.name || 'unknown';
    let args = '';
    const fnArgs = tc.function?.arguments || tc.function?.rawArgs;
    if (fnArgs) {
      let a = fnArgs;
      if (typeof a === 'object') { args = JSON.stringify(a, null, 2); }
      else if (typeof a === 'string') { try { args = JSON.stringify(JSON.parse(a), null, 2); } catch(e) { args = a; } }
    }
    html += '<div class="req-tool-pair" style="margin:6px 0;padding:8px 10px;background:#0d1117;border:1px solid #2a2e35;border-radius:6px">';
    html += '<div class="tp-name" style="color:#ffa657;font-size:.82rem;font-weight:600;margin-bottom:4px">\u26a1 ' + escHtml(nm) + '</div>';
    html += '<div class="tp-args" style="margin-bottom:4px"><div style="color:#8b949e;font-size:.72rem;font-weight:500">\uD83D\uDCCB Args:</div><pre style="margin:4px 0 0;font-size:.7rem;overflow:auto;color:#c5c8c6;white-space:pre-wrap;word-break:break-word">' + escHtml(args || '{}') + '</pre></div>';
    html += '<div class="tp-out" style="border-top:1px solid #2a2e35;padding-top:4px"><div style="color:#50fa7b;font-size:.72rem;font-weight:500">\uD83D\uDCE4 Exec:</div><div style="color:#8b949e;font-size:.7rem;margin-top:2px">⏳ waiting for output...</div></div>';
    html += '</div>';
  });
  return html;
}


function buildGroups() {
  if (logs.length === 0) return {};
  const map = new Map();

  logs.forEach(log => {
    const key = makeGroupKey(log);
    let g = map.get(key);
    if (!g) {
      g = {
        key,
        prompt: normalizePrompt(log.userPrompt) || '(no prompt)',
        items: [],
        firstTs: log.timestamp,
        lastTs: log.timestamp,
        hasError: false,
        hasActive: false,
        decodedText: null,
        toolCallsExec: [],
        systemContexts: new Set()
      };
      map.set(key, g);
    }
    g.items.push(log);
    if (log.status === 'error' || log.error) g.hasError = true;
    if (log.status === 'streaming' || log.status === 'pending') g.hasActive = true;
    if (log.decodedText) {
      const txt = log.decodedText.trim();
      if (txt && (!g.decodedText || !g.decodedText.includes(txt))) {
        g.decodedText = g.decodedText ? g.decodedText + '\n\n---\n\n' + txt : txt;
      }
    }
    if (log.toolCallsExec && log.toolCallsExec.length) {
      // Append, deduplicate by function name+arguments
      log.toolCallsExec.forEach(tc => {
        const tcKey = tc.function?.name + '|' + JSON.stringify(tc.function?.arguments);
        if (!g.toolCallsExec.find(ex => (ex.function?.name + '|' + JSON.stringify(ex.function?.arguments)) === tcKey)) {
          g.toolCallsExec.push({...tc, _groupIndex: g.toolCallsExec.length});
        }
      });
    }

    if (log.systemContext) g.systemContexts.add(log.systemContext.slice(0, 200));
    if (new Date(log.timestamp) < new Date(g.firstTs)) g.firstTs = log.timestamp;
    if (new Date(log.timestamp) > new Date(g.lastTs)) g.lastTs = log.timestamp;
  });

  // Sortiraj: od najstarijeg ka najnovijem (chronological)
  map.forEach(g => g.items.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)));
  console.log('[BUILD] grupe:', [...map.entries()].map(([k,g]) => ({key:k, lastTs:g.lastTs, firstTs:g.firstTs, cnt:g.items.length})));
  return Object.fromEntries(map);
}

function groupStatus(g) {
  if (!g.items.length) return 'complete';
  // Status is based on the newest (last) req in the group
  const last = g.items[g.items.length - 1];
  if (last.status === 'error' || last.error) return 'error';
  if (last.status === 'streaming' || last.status === 'pending') return 'active';
  // Fallback: check if any item is still active
  for (const item of g.items) {
    if (item.status === 'streaming' || item.status === 'pending') return 'active';
  }
  return 'complete';
}

function updateSummary(groups) {
  const grp = Object.keys(groups).length;
  const total = Object.values(groups).reduce((s, g) => s + g.items.length, 0);
  const dur = Object.values(groups).reduce((s, g) => s + g.items.reduce((a, i) => a + (i.durationMs || 0), 0), 0);
  const data = Object.values(groups).reduce((s, g) => s + g.items.reduce((a, i) => a + (i.requestSize || 0) + (i.responseSize || 0), 0), 0);
  document.getElementById('summary').textContent = `${grp} groups │ ${total} requests │ ${fmtDur(dur)} │ ${fmtSz(data)}`;
  let ac = 0, co = 0, er = 0;
  Object.values(groups).forEach(g => { const st = groupStatus(g); if (st === 'active') ac++; else if (st === 'error') er++; else co++; });
  document.getElementById('summaryBar').innerHTML =
    `<div class="seg"><span style="color:#50fa7b">●</span> Completed: <b>${co}</b></div>` +
    `<div class="seg"><span style="color:#f1fa8c">●</span> Active: <b>${ac}</b></div>` +
    `<div class="seg"><span style="color:#ff5555">●</span> Error: <b>${er}</b></div>` +
    `<div class="seg">📊 <b>${grp}</b> groups / <b>${total}</b> requests</div>`;
}

// Start ticker for updating duration of active requests and groups
function startGroupsTicker() {
  if (groupsTicker) return;
  groupsTicker = setInterval(() => {
    const now = Date.now();
    document.querySelectorAll('.group').forEach(el => {
      const key = el.dataset.groupKey;
      if (!key) return;
      // Azuriraj r-dur za sve pending/streaming req-row-eve
      el.querySelectorAll('.req-row').forEach(row => {
        const st = row.querySelector('.r-st')?.textContent;
        if (st === '🌊' || st === '⏳') {
          const id = row.dataset.reqId;
          const log = logs.find(l => l.id === id);
          if (log) {
            // Ako imamo startTime izracunaj duration od pocetka
            let dur = log.durationMs || 0;
            if (log.timestamp) {
              const elapsed = now - new Date(log.timestamp).getTime();
              if (elapsed > dur) dur = elapsed;
            }
            const durEl = row.querySelector('.r-dur');
            if (durEl) durEl.textContent = fmtDur(dur);
            // Sacuvaj u log za grupni izracun
            log._liveDur = dur;
          }
        }
      });
      // Azuriraj header grupe
      const durEl = el.querySelector('.g-hdr .dur');
      if (durEl) {
        const grpItems = logs.filter(l => makeGroupKey(l) === key);
        const totalMs = grpItems.reduce((s, i) => s + (i._liveDur || i.durationMs || 0), 0);
        durEl.textContent = `⏱ ${fmtDur(totalMs)}`;
      }
    });
  }, 2000);
}

function updateDecodedSection(det, g) {
  let fullText = '';
  const seen = new Set();
  g.items.forEach(item => {
    if (item.decodedText) {
      const txt = item.decodedText.trim();
      if (txt && !seen.has(txt)) {
        seen.add(txt);
        fullText = fullText ? fullText + '\n\n---\n\n' + txt : txt;
      }
    }
  });
  if (!fullText) return;
  const oldDecodedLabel = det.querySelector('.decoded-prompt');
  const oldDecodedText = oldDecodedLabel ? oldDecodedLabel.textContent || '' : '';
  if (fullText.length > oldDecodedText.length) {
    const newSec = '<div class="detail-section"><span class="lbl">💬 Decoded response:</span><div class="decoded-prompt">' + escHtml(fullText) + '</div></div>';
    if (oldDecodedLabel) oldDecodedLabel.closest('.detail-section').outerHTML = newSec;
    else det.insertAdjacentHTML('afterbegin', newSec);
    const dp = det.querySelector('.decoded-prompt'); if (dp) requestAnimationFrame(() => { dp.scrollTop = dp.scrollHeight; });
  }
}

function buildGroupHtml(g) {
  const st = groupStatus(g);
  const dur = fmtDur(g.items.reduce((s, i) => s + (i.durationMs || 0), 0));
  const cnt = g.items.length;
  const stCls = st === 'error' ? 'error' : (st === 'active' ? 'active' : 'complete');
  let stLbl;
  if (st === 'error') {
    // Use only the latest item's error for the group status label
    const latestErr = g.items[g.items.length - 1].error || '';
    const isOllamaErr = /timeout|timed out|ECONNREFUSED|ECONNRESET|5\d\d|Ollama|ollama/i.test(latestErr);
    stLbl = isOllamaErr ? '⚠ Ollama' : '⚠ Interrupted';
  } else {
    stLbl = st === 'active' ? '⏳ Active' : '✓ Completed';
  }
  const truncated = g.prompt.length > 1000;
  const display = truncated ? g.prompt.slice(0, 1000) + '…' : g.prompt;
  // Collect all tools from items that have them (each item provides its own requestToolCalls)
  const allToolCalls = [];
  const seenTool = new Set();
  g.items.forEach(item => {
    (item.requestToolCalls || []).forEach(tc => {
      const name = tc.function?.name || tc.name;
      if (name && !seenTool.has(name)) { seenTool.add(name); allToolCalls.push(tc); }
    });
  });
  const hasTools = allToolCalls.length > 0;

  // Decoded section - uzmi najduži decodedText ili error iz svih item-a
  let decodedHtml = '';
  // Collect ALL unique decoded texts chronologically, concatenated
  let bestDecoded = '';
  let groupError = null;
  const seen = new Set();
  g.items.forEach(item => {
    if (item.decodedText) {
      const txt = item.decodedText.trim();
      if (txt && !seen.has(txt)) {
        seen.add(txt);
        bestDecoded = bestDecoded ? bestDecoded + '\n\n---\n\n' + txt : txt;
      }
    }
    if (item.error && !groupError) groupError = item.error;
  });
  if (groupError && !bestDecoded) {
    const isOllamaError = /timeout|timed out|ECONNREFUSED|ECONNRESET|5\d\d|Ollama|ollama/i.test(groupError);
    const agent = isOllamaError ? 'Ollama' : 'Agent';
    decodedHtml = `<div class="detail-section"><span class="lbl">⚠️ Error (${agent}):</span><div class="decoded-prompt" style="color:#ff5555;border-color:#5a1a1a">${escHtml(groupError)}</div></div>`;
  } else if (bestDecoded) {
    decodedHtml = `<div class="detail-section"><span class="lbl">💬 Decoded response:</span><div class="decoded-prompt">${escHtml(bestDecoded)}</div></div>`;
  }

  // Tool display per request - each req shows its own tool calls + outputs

  // Req rows
  let rowsHtml = '';
  g.items.forEach((item, idx) => {
    const rIcon = item.status === 'error' ? '❌' : (item.status === 'pending' ? '⏳' : (item.status === 'streaming' ? '🌊' : '✅'));
    const rLbl = item.status === 'error' ? '❌ Error' : (item.status === 'pending' ? '⏳ Waiting for response' : (item.status === 'streaming' ? '🌊 Waiting for response' : '✅'));
    const rCls = item.status === 'error' ? 'err' : (item.status === 'pending' ? 'pend' : (item.status === 'streaming' ? 'stream' : 'ok'));
    const rLblCss = item.status === 'pending' || item.status === 'streaming' ? 'font-size:.65rem;color:#6a6e75;margin-left:4px;font-weight:400' : '';
    const rErr = item.error ? escHtml(item.error.slice(0,300)) : '';
    
    const previewTxtB = item.decodedText ? item.decodedText.replace(/\n/g,' ').slice(0,500) + (item.decodedText.length>500?'…':'') : (item.error ? '❌ ' + item.error.slice(0,200) : '');
    
    // Tool calls/outputs: show tool exec (from toolCallsExec or requestToolCalls), outputs matched by ID
    let toolPairsHtml = '';
    if (item.toolOutputs && item.toolOutputs.length > 0) {
      toolPairsHtml += generateToolOutputHtml(item.toolOutputs, item.id);
    } else if (item.toolCallsExec && item.toolCallsExec.length > 0) {
      toolPairsHtml += generateToolCallHtml(item.toolCallsExec);
    } else if (item.requestToolCalls && item.requestToolCalls.length > 0) {
      toolPairsHtml += generateToolCallHtml(item.requestToolCalls);
    }
    let rb = item.responseBody ? `<div class="detail-section"><span class="lbl">📥 Response:</span><pre>${highlightJSON(prettyJSON(item.responseBody))}</pre></div>` : '';
    // Request summary - clean display instead of raw JSON dump
    let rq = item.requestSummary ? `
      <div class="detail-section">
        <div class="req-summary">
          <span class="summary-label">📤 Request Summary</span>
          <div class="summary-row"><span class="summary-label">Model:</span><span class="summary-content">${escHtml(item.requestSummary.model || '')}</span></div>
          ${item.requestSummary.messageCount != null ? `<div class="summary-row"><span class="summary-label">Messages:</span><span class="summary-content">${item.requestSummary.messageCount}</span></div>` : ''}
          ${item.requestSummary.stream != null ? `<div class="summary-row"><span class="summary-label">Streaming:</span><span class="summary-content">${item.requestSummary.stream ? '✓' : '✗'}</span></div>` : ''}
          ${item.requestSummary.lastMessage ? `<div class="summary-row"><span class="summary-label">Last message:</span><span class="summary-content">${escHtml(item.requestSummary.lastMessage.role || '')}</span></div>` : ''}
          ${item.requestSummary.userPrompt ? `
            <div class="summary-row">
              <span class="summary-label">💬 User prompt:</span>
              <span class="summary-content truncate" id="rq-summary-${escHtml(item.id)}">${escHtml(item.requestSummary.userPrompt)}</span>
              ${item.requestSummary.userPrompt.length > 200 ? `<span class="expand-btn" onclick="this.previousElementSibling.classList.toggle('truncate');this.textContent=this.textContent==='show more'?'show less':'show more'">show more</span>` : ''}
            </div>` : ''}
          ${item.requestSummary.lastMessage && item.requestSummary.lastMessage.content ? `
            <div class="summary-row">
              <span class="summary-label">Last msg content:</span>
              <span class="summary-content" style="color:#6a6e75;font-size:.7rem;">${escHtml(item.requestSummary.lastMessage.content.slice(0, 300))}${item.requestSummary.lastMessage.content.length > 300 ? '…' : ''}</span>
            </div>` : ''}
          ${item.requestSummary.hasTools != null ? `<div class="summary-row"><span class="summary-label">Tools:</span><span class="summary-content">${item.requestSummary.hasTools ? '✓ (' + (item.requestSummary.toolChoice || 'auto') + ')' : '✗'}</span></div>` : ''}
        </div>
      </div>` : '';
    rowsHtml +=`<div class="req-row" data-req-id="${escHtml(item.id)}">` +
      `<div class="req-hdr" onclick="toggleReq(this)"><span class="r-num">${idx + 1}</span><span class="r-ts">${fmtTs(item.timestamp)}</span><span class="r-st ${rCls}">${rIcon}<span class="r-st-text" style="${rLblCss}">${rLbl.split(' ').slice(1).join(' ')}</span></span><span class="r-preview">${escHtml(previewTxtB)}</span><span class="r-dur${item.status === 'done' || item.status === 'error' ? ' right' : ''}">${fmtDur(item.durationMs)}</span>${stopBtnHtml(item.id, item.status)}</div>` +
      `<div class="req-body">${rErr ? `<div class="detail-section"><span class="lbl" style="color:#ff5555">⚠️ Error:</span><div class="decoded-prompt" style="color:#ff5555;border-color:#5a1a1a;font-size:.75rem;padding:8px">${rErr}</div></div>` : ''}${rb}${rq}${toolPairsHtml}</div></div>`;
  });

  var tsIcon = '&#128197;'; // calendar
  var durIcon = '&#9201;'; // stopwatch
  return `<div class="g-hdr" onclick="toggleGroup(this)"><span class="arrow">&#9654;</span><span class="ts">${tsIcon} ${fmtTs(g.firstTs)}</span><span class="prompt">${escHtml(display)}</span>${truncated ? `<span class="expand-link" onclick="event.stopPropagation();expandGroupPrompt(this)" data-full="${escHtml(g.prompt)}">show full</span>` : ''}<span class="status ${stCls}">${stLbl}</span><span class="dur">${durIcon} ${dur}</span><span class="count">${cnt}x</span>${hasTools ? `<span class="tools-badge">&#x1F527; ${g.toolCallsExec.length}</span>` : ''}</div><div class="g-det">${decodedHtml}${rowsHtml}</div>`;
}

function render(groups, onlyKey) {
  const container = document.getElementById('groups');
  const allVals = Object.values(groups);
  const sorted = onlyKey ? allVals.filter(g => g.key === onlyKey) : allVals.sort((a, b) => new Date(b.lastTs) - new Date(a.lastTs));

  // Sacuvaj expand state iz DOM-a pre bilo kakvih promena (samo pri full render)
  const oldExpanded = {};
  if (!onlyKey) {
    container.querySelectorAll('.group').forEach(el => {
      const key = el.dataset.groupKey;
      if (key && el.querySelector('.g-hdr.expanded')) oldExpanded[key] = true;
    });
  }

  // Hash-based diffing: poredi samo status + duration, ne data koja se menjaju u streamu
  if (!onlyKey) {
    const newHash = sorted.map(g => g.key + ':' + g.items.map(i => i.status + '|' + (i.durationMs||0)).join(',')).join(';');
    if (container.dataset.lastHash === newHash) return;
    container.dataset.lastHash = newHash;
  }

  // Ukloni placeholder ako postoji
  const placeholderEl = container.querySelector('.empty');
  if (placeholderEl) placeholderEl.remove();

  // Azuriraj postojece grupe i dodaj nove u sortiranom redosledu
  const existingSet = onlyKey ? new Set() : new Set(sorted.map(g => g.key));
  let prevEl = null;
  sorted.forEach((g) => {
    let el = container.querySelector(`.group[data-group-key="${CSS.escape(g.key)}"]`);
    if (!el) {
      // New group - create
      el = document.createElement('div');
      el.className = 'group';
      el.dataset.groupKey = g.key;
      el.innerHTML = buildGroupHtml(g);
      // Ubaci na pravo mesto (posle prevEl)
      if (prevEl && prevEl.nextSibling) {
        container.insertBefore(el, prevEl.nextSibling);
      } else if (!prevEl && container.firstChild) {
        container.insertBefore(el, container.firstChild);
      } else {
        container.appendChild(el);
      }
    } else {
      // Existing group - update content
      // Prvo proveri da li je na pravom mestu
      if (prevEl) {
        const expectedNext = prevEl.nextSibling;
        if (expectedNext !== el) {
          container.insertBefore(el, expectedNext && expectedNext.classList.contains('group') ? expectedNext : (prevEl.nextSibling || null));
        }
      } else if (container.firstChild && container.firstChild !== el) {
        container.insertBefore(el, container.firstChild);
      }

      // Azuriraj header info
      const hdr = el.querySelector('.g-hdr');
      if (hdr) {
        const st = groupStatus(g);
        const stCls = st === 'error' ? 'error' : (st === 'active' ? 'active' : 'complete');
        let stLbl;
        if (st === 'error') {
          // Use only the latest item's error for the group status label
          const latestErr = g.items[g.items.length - 1].error || '';
          stLbl = /timeout|timed out|ECONNREFUSED|ECONNRESET|5\d\d|Ollama|ollama/i.test(latestErr) ? '⚠ Ollama' : '⚠ Interrupted';
        } else {
          stLbl = st === 'active' ? '⏳ Active' : '✓ Completed';
        }
        const dur = fmtDur(g.items.reduce((s, i) => s + (i.durationMs || 0), 0));
        hdr.querySelector('.status').className = `status ${stCls}`;
        hdr.querySelector('.status').textContent = stLbl;
        hdr.querySelector('.dur').textContent = `⏱ ${dur}`;
        hdr.querySelector('.count').textContent = `${g.items.length}x`;
      }
      // Update decodedText - concatenate all unique texts chronologically
      const det = el.querySelector('.g-det');
      if (det) {
        let fullText = '';
        let groupError = null;
        const seen = new Set();
        g.items.forEach(item => {
          if (item.decodedText) {
            const txt = item.decodedText.trim();
            if (txt && !seen.has(txt)) {
              seen.add(txt);
              fullText = fullText ? fullText + '\n\n---\n\n' + txt : txt;

          if (item.error && !groupError) groupError = item.error;

          const isOllamaError = /timeout|timed out|ECONNREFUSED|ECONNRESET|5\d\d|Ollama|ollama/i.test(groupError);
          const agent = isOllamaError ? 'Ollama' : 'Agent';

          const oldErrLabel = det.querySelector('.decoded-prompt');
          if (oldErrLabel) oldErrLabel.closest('.detail-section').outerHTML = errHtml;
          else det.insertAdjacentHTML('afterbegin', errHtml);
          const dp = det.querySelector('.decoded-prompt'); if (dp) requestAnimationFrame(() => { dp.scrollTop = dp.scrollHeight; });
        } else if (fullText.length > 0) {

            }
            const rb = item.responseBody ? `<div class="detail-section"><span class="lbl">📥 Response:</span><pre>${highlightJSON(prettyJSON(item.responseBody))}</pre></div>` : '';
            const rq = item.requestBody ? `<div class="detail-section"><span class="lbl req-toggle" onclick="event.stopPropagation();this.nextElementSibling.classList.toggle('show')">📤 Request <span style="font-size:.6rem;color:#565b66">(click to show)</span></span><pre class="req-body-raw req-collapsed">${escHtml(fixNewlines(item.requestBody))}</pre></div>` : '';
            const nr = document.createElement('div');
            nr.className = 'req-row';
            nr.dataset.reqId = item.id;
            nr.innerHTML = `<div class="req-hdr" onclick="toggleReq(this)"><span class="r-num">${idx + 1}</span><span class="r-ts">${fmtTs(item.timestamp)}</span><span class="r-st ${rc}">${ri}</span><span class="r-preview">${escHtml(pv)}</span><span class="r-dur${item.status === 'done' || item.status === 'error' ? ' right' : ''}">${fmtDur(item.durationMs)}</span>${stopBtnHtml(item.id, item.status)}</div><div class="req-body">${rErr}${rb}${rq}${toolPairsHtml}</div>`;
            // Append new req-row at the bottom (oldest at top, newest at bottom)
            det.appendChild(nr);
          }
        });
        // Re-order req-rows in DOM to match g.items chronological order (oldest→newest)
        {
          const sortedIds = g.items.map(i => i.id);
          const rows = [...det.querySelectorAll('.req-row')];
          rows.sort((a, b) => sortedIds.indexOf(a.dataset.reqId) - sortedIds.indexOf(b.dataset.reqId));
          rows.forEach(r => det.appendChild(r));
        }
        // Azuriraj grupni header (status, dur, count, tools)
        {
          const hdr = el.querySelector('.g-hdr');
          if (hdr) {
            const st = groupStatus(g);
            const dur = fmtDur(g.items.reduce((s, i) => s + (i.durationMs || 0), 0));
            const stCls = st === 'error' ? 'error' : (st === 'active' ? 'active' : 'complete');
            let stLbl;
            if (st === 'error') {
              // Use only the latest item's error for the group status label
              const latestErr = g.items[g.items.length - 1].error || '';
              stLbl = /timeout|timed out|ECONNREFUSED|ECONNRESET|5\d\d|Ollama|ollama/i.test(latestErr) ? '⚠ Ollama' : '⚠ Interrupted';
            } else {
              stLbl = st === 'active' ? '⏳ Active' : '✓ Completed';
            }
            hdr.querySelector('.status').textContent = stLbl;
            hdr.querySelector('.status').className = 'status ' + stCls;
            hdr.querySelector('.dur').textContent = '\u23f1 ' + dur;
            hdr.querySelector('.count').textContent = g.items.length + 'x';
            // Update tools badge
            const allToolCalls = [];
            const seenTool = new Set();
            g.items.forEach(item => {
              (item.requestToolCalls || []).forEach(tc => {
                const name = tc.function?.name || tc.name;
                if (name && !seenTool.has(name)) { seenTool.add(name); allToolCalls.push(tc); }
              });
            });
            const hasTools = allToolCalls.length > 0;
            let badge = hdr.querySelector('.tools-badge');
            if (hasTools) {
              if (!badge) {
                badge = document.createElement('span');
                badge.className = 'tools-badge';
                hdr.appendChild(badge);
              }
              badge.textContent = '\uD83D\uDD27 ' + allToolCalls.length;
            } else if (badge) {
              badge.remove();
            }
          }
        }
        // Update decoded section - concatenate all unique texts chronologically
        {
          let fullText = '';
          const seen = new Set();
          g.items.forEach(item => {
            if (item.decodedText) {
              const txt = item.decodedText.trim();
              if (txt && !seen.has(txt)) {
                seen.add(txt);
                fullText = fullText ? fullText + '\n\n---\n\n' + txt : txt;
              }
            }
          });
          const det = el.querySelector('.g-det');
          if (det) {
            const oldDecodedLabel = det.querySelector('.decoded-prompt');
            const oldDecodedText = oldDecodedLabel ? oldDecodedLabel.textContent || '' : '';
            if (fullText.length > oldDecodedText.length) {
              const newSec = '<div class="detail-section"><span class="lbl">💬 Dešifrovani odgovor:</span><div class="decoded-prompt">' + escHtml(fullText) + '</div></div>';
              if (oldDecodedLabel) oldDecodedLabel.closest('.detail-section').outerHTML = newSec;
              else det.insertAdjacentHTML('afterbegin', newSec);
              const dp = det.querySelector('.decoded-prompt'); if (dp) requestAnimationFrame(() => { dp.scrollTop = dp.scrollHeight; });
            }
          }
        }
        // Ukloni req-row-eve koji vise ne postoje
        det.querySelectorAll('.req-row').forEach(row => {
          if (!knownIds.has(row.dataset.reqId)) row.remove();
        });
      }
    }
    prevEl = el;
  });

  // Ukloni grupe koje vise ne postoje (samo pri full render)
  if (!onlyKey) {
    container.querySelectorAll('.group').forEach(el => {
      if (!existingSet.has(el.dataset.groupKey)) el.remove();
    });

    // If no groups, show placeholder
    if (!sorted.length) {
      container.innerHTML = '<div class="empty">No active requests...</div>';
    }

    // Restore expand state from DOM
    Object.keys(oldExpanded).forEach(key => {
      const el = container.querySelector(`.group[data-group-key="${CSS.escape(key)}"]`);
      if (el) {
        const hdr = el.querySelector('.g-hdr');
        const det = el.querySelector('.g-det');
        if (hdr && det) {
          hdr.classList.add('expanded');
          det.classList.add('open');
        }
      }
    });
  }
}

function refresh() {
  fetch('/api/logs').then(r => r.json()).then(data => {
    logs = data.slice(0, 200);
    rebuildToolCallMap();
    const g = buildGroups();
    updateSummary(g);
    render(g);
  });
}

const socket = io();
let socketLastUpdate = 0;

// Polling fallback - ako Socket.IO ne radi, polliraj svake 2s
let lastPollHash = '';
function pollLogs() {
  fetch('/api/logs').then(r => r.json()).then(data => {
    // Poredi samo ID + status - ignorisi decodedText/promene duzine
    const hash = JSON.stringify(data.map(l => l.id + ':' + l.status + ':' + (l.durationMs||0)));
    if (hash !== lastPollHash) {
      lastPollHash = hash;
      if (Date.now() - socketLastUpdate > 1000) {
        logs = data;
        const g = buildGroups();
        updateSummary(g);
        render(g);
      }
    }
  }).catch(() => {});
}
setInterval(pollLogs, 5000); // polling samo kad Socket.IO padne

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('clrBtn').onclick = () => {
  fetch('/api/logs', { method: 'DELETE' }).then(r => r.json()).then(() => {
    logs = []; expandedGroups = {}; rebuildToolCallMap(); refresh();
  }).catch(() => { logs = []; expandedGroups = {}; rebuildToolCallMap(); refresh(); });
};
  startGroupsTicker();

  socket.on('init', data => { logs = data; rebuildToolCallMap(); refresh(); });
  socket.on('log-update', payload => {
    const i = logs.findIndex(l => l.id === payload.id);
    const statusChanged = i < 0 || logs[i].status !== payload.status;
    if (i >= 0) logs[i] = payload;
    else { logs.unshift(payload); if (logs.length > 200) logs.pop(); }
    socketLastUpdate = Date.now();
    if (!statusChanged && (payload.status === 'done' || payload.status === 'error')) {
      // Completed request sa istim statusom — samo osvezi preview, duration i decodedText
      document.querySelectorAll(`.req-row[data-req-id="${CSS.escape(payload.id)}"]`).forEach(el => {
        const hdr = el.querySelector('.req-hdr');
        if (!hdr) return;
        const pv = payload.decodedText ? payload.decodedText.replace(/\n/g,' ').slice(0,500) + (payload.decodedText.length>500?'...':'') : (payload.error ? '❌ ' + payload.error.slice(0,200) : '');
        const pr = hdr.querySelector('.r-preview');
        if (pr) pr.textContent = pv;
        const dur = hdr.querySelector('.r-dur');
        if (dur) dur.textContent = fmtDur(payload.durationMs);
      });
      // Update decoded section i group header
      const g = buildGroups();
      const match = Object.values(g).find(grp => grp.items.some(it => it.id === payload.id));
      if (match) {
        const groupEl = document.querySelector(`.group[data-group-key="${CSS.escape(match.key)}"]`);
        if (groupEl) {
          const det = groupEl.querySelector('.g-det');
          if (det) updateDecodedSection(det, match);
          // Update group header (status, duration, count)
          const ghdr = groupEl.querySelector('.g-hdr');
          if (ghdr) {
            const st = groupStatus(match);
            const dur = fmtDur(match.items.reduce((s, i) => s + (i.durationMs || 0), 0));
            ghdr.querySelector('.status').textContent = st === 'error' ? '⚠ Interrupted' : '✓ Completed';
            ghdr.querySelector('.dur').textContent = '\u23f1 ' + dur;
            ghdr.querySelector('.count').textContent = match.items.length + 'x';
          }
        }
      }
    } else {
      // Status se promenio (pending->streaming->done) ili nov req — samo tu grupu rebuilduj
      rebuildToolCallMap();
      const g = buildGroups();
      updateSummary(g);
      const matchKey = payload.id ? Object.values(g).find(grp => grp.items.some(it => it.id === payload.id))?.key : null;
      render(g, matchKey);
    }
  });
  socket.on('live-duration', data => {
    const i = logs.findIndex(l => l.id === data.id);
    if (i >= 0 && logs[i].durationMs !== data.durationMs) {
      logs[i].durationMs = data.durationMs;
      document.querySelectorAll(`.req-row[data-req-id="${CSS.escape(data.id)}"]`).forEach(el => {
        const durEl = el.querySelector('.r-dur');
        if (durEl) durEl.textContent = fmtDur(data.durationMs);
      });
      const g = buildGroups();
      updateSummary(g);
      Object.values(g).forEach(grp => {
        const el = document.querySelector(`.group[data-group-key="${CSS.escape(grp.key)}"]`);
        if (!el) return;
        const hdr = el.querySelector('.g-hdr');
        if (!hdr) return;
        const st = groupStatus(grp);
        hdr.querySelector('.status').textContent = st === 'active' ? '⏳ Active' : (st === 'error' ? '⚠ Interrupted' : '✓ Completed');
        hdr.querySelector('.status').className = `status ${st === 'error' ? 'error' : (st === 'active' ? 'active' : 'complete')}`;
        hdr.querySelector('.dur').textContent = `⏱ ${fmtDur(grp.items.reduce((s, i) => s + (i.durationMs || 0), 0))}`;
      });
    }
  });
  refresh();
});
</script>
